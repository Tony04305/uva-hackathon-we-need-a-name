<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Plant design review</title><style>body{margin:0}header{padding:20px;text-align:center}#stages{display:grid;grid-template-columns:repeat(4,1fr)}#stages>div{padding:15px;text-align:center}#stages svg{max-width:250px}</style><header>We Need a Name · plant design review</header><div id="specimens"></div><div id="stages"></div><script type="module">import '/src/style.css'; import { PLANTS } from '/src/plants.js'; import { renderCollection } from '/src/collection.js'; import { renderPlant } from '/src/plant.js'; document.querySelector('#specimens').innerHTML=renderCollection({collection:PLANTS.map(p=>({plantId:p.id,count:1,firstCollectedAt:0})),totalGrown:10}); document.querySelector('#stages').innerHTML=PLANTS.flatMap(p=>[0,1,2,3].map(s=>`<div>${renderPlant(s,p.id)}<p>${p.name} · ${s}/3</p></div>`)).join('');</script></html>
